name: protoreg

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  protoreg_test:
    name: protoreg plugin (Go ${{ matrix.go }}, OS ${{matrix.os}})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        go: [stable]
        os: ["ubuntu-latest"]
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: ${{ matrix.go }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Init Go modules Cache # Docs: <https://git.io/JfAKn#go---modules>
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install Go dependencies
        run: go mod download

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run root module unit tests
        run: |
          mkdir ./tests/coverage-ci
          go test -timeout 5m -v -race -cover -tags=debug -coverpkg=./... -coverprofile=./tests/coverage-ci/protoreg_unit.out -covermode=atomic ./...

      - name: Run golang integration tests
        run: |
          cd tests
          go test -timeout 20m -v -race -cover -tags=debug -coverpkg=github.com/roadrunner-server/protoreg/v6/... -coverprofile=./coverage-ci/protoreg_root.out -covermode=atomic ./...

      - name: Transform code coverage results
        run: |
          cd tests/coverage-ci
          echo 'mode: atomic' > summary.txt
          tail -q -n +2 *.out >> summary.txt
          awk '
            NR == 1 { print; next }
            /^github\.com\/roadrunner-server\/protoreg\/v6\// {
              sub(/^github\.com\/roadrunner-server\/protoreg\/v6\//, "", $0)
              print
            }
          ' summary.txt > summary.filtered.txt
          mv summary.filtered.txt summary.txt
          # a profile that maps to no plugin source uploads fine and reports 0%
          blocks=$(($(wc -l < summary.txt) - 1))
          if [ "$blocks" -lt 10 ]; then
            echo "::error::coverage summary holds $blocks blocks, the profile does not map to plugin sources"
            exit 1
          fi

      - name: upload to codecov
        uses: codecov/codecov-action@v7 # Docs: <https://github.com/codecov/codecov-action>
        with:
          files: tests/coverage-ci/summary.txt
          fail_ci_if_error: false
